name: CI
on: [push, pull_request]
permissions: { contents: read }
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      ingestion: ${{ steps.filter.outputs.ingestion }}
      source_pipeline: ${{ steps.filter.outputs.source_pipeline }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            ingestion:
              - '.github/workflows/ci.yml'
              - 'cloudflare/d1-store.ts'
              - 'cloudflare/ingestion-worker.ts'
              - 'cloudflare/migrations/**'
              - 'package.json'
              - 'src/ingestion/**'
              - 'src/*-dispatch.ts'
              - 'src/*-worker.ts'
              - 'src/destination-verification.ts'
              - 'src/poll.ts'
              - 'src/store.ts'
              - 'src/types.ts'
              - 'src/sources/**'
              - 'test/**/*ingestion*'
              - 'test/e2e/api-ingestion-split.e2e.mjs'
              - 'test/poll.test.ts'
              - 'test/source-occurrence-pagination.test.ts'
              - 'wrangler.ingestion.jsonc'
              - 'wrangler.dev.ingestion.jsonc'
            source_pipeline:
              - 'src/sources/**'
              - 'src/core/markdown.ts'
              - 'scripts/source-quality.ts'
              - 'test/**sources**'
              - 'test/**quality**'
              - 'SOURCES.md'
              - 'EMPLOYERS.json'
            web:
              - '.github/workflows/ci.yml'
              - 'mobile/**'
              - 'shared/**'
              - 'docs/policy.css'
              - 'docs/privacy.html'
              - 'docs/retention.html'
              - 'docs/source-policy.html'
              - 'docs/support.html'
              - 'docs/terms.html'
  verify-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run types:cloudflare:ingestion:check
      # GitHub's two-core hosted runner can starve Vitest's four local forks long
      # enough for its worker RPC to time out after every test has passed.
      - run: npm test -- --maxWorkers=2

  ingestion-traffic-contracts:
    name: Ingestion traffic contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run test/d1-traffic-controller.test.ts test/d1-traffic-observation.test.ts test/cloudflare-worker.test.ts

  ingestion-smoke:
    name: Ingestion smoke
    needs: changes
    if: needs.changes.outputs.ingestion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:ingestion:ci

  ingestion-resource-budget:
    name: Ingestion resource budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:budget

  worker-bundles:
    name: Worker bundles
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:cloudflare

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run test:e2e

  infrastructure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: opentofu/setup-opentofu@v1
      - run: npm ci
      - run: npm run build:cloudflare
      - run: npm run terraform:fmt
      - run: tofu -chdir=infra/cloudflare init -backend=false
      - run: npm run terraform:validate
  live-source-quality:
    needs: changes
    if: needs.changes.outputs.source_pipeline == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run source:quality -- --output artifacts/source-quality.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: source-quality-report
          path: artifacts/source-quality.json
          if-no-files-found: warn
  verify-mobile:
    needs: changes
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: mobile/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx expo config --type public
      - run: npm run web:export
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
        with:
          name: web-dist-${{ github.sha }}
          path: mobile/dist
          if-no-files-found: error
          retention-days: 1
  deploy-web:
    needs: [changes, verify-core, ingestion-traffic-contracts, ingestion-resource-budget, worker-bundles, e2e, infrastructure, verify-mobile]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: cloudflare-pages-production
      url: https://ntern.app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ github.sha }}
          path: mobile/dist
      - name: Reject an obsolete main revision
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$GITHUB_SHA"
      - name: Deploy verified web artifact
        run: npx wrangler pages deploy mobile/dist --project-name internnotifs --branch main --commit-hash "${GITHUB_SHA}" --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
