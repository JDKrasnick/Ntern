name: One-off trusted-admission re-grade

# Manual, idempotent repair: re-evaluates stored trusted-community admissions
# with the catalog gate open and publishes the rows a closed gate had withheld.
# Runs in the deploy environment so it can use the operations key without it ever
# leaving the repository's secret store.
on:
  workflow_dispatch: {}

jobs:
  regrade:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-workers-production
      url: https://intern-notifs.jdkrasnick.workers.dev
    env:
      OPERATIONS_SHARED_SECRET: ${{ secrets.OPERATIONS_SHARED_SECRET }}
      CATALOG_API_URL: ${{ vars.PUBLIC_API_URL }}
    steps:
      - name: Report the plan and apply it
        shell: bash
        run: |
          set -euo pipefail
          post() {
            curl -fsS -X POST "$CATALOG_API_URL/internal/trusted-admission-backfill" \
              -H "X-Operations-Key: $OPERATIONS_SHARED_SECRET" \
              -H 'Content-Type: application/json' -d "$1"
          }
          dry=$(post '{"apply":false}')
          echo "$dry" | jq '{dryRun, totals, changes, before, after}'
          token=$(echo "$dry" | jq -r '.repairToken')
          expected=$(echo "$dry" | jq -r '.expectedChanged')
          echo "expectedChanged=$expected"
          if [ "$expected" = "0" ]; then echo "nothing to publish"; exit 0; fi
          post "{\"apply\":true,\"repairToken\":\"$token\",\"expectedChanged\":$expected}" \
            | jq '{applied: .applied, appliedTotals, projectionRefreshRequired, verification: {dryRun: .verification.dryRun, totals: .verification.totals}}'
