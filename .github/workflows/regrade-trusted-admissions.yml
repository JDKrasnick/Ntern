name: One-off trusted-admission re-grade

# Manual, idempotent repair: re-evaluates stored trusted-community admissions
# with the catalog gate open and publishes rows a closed gate had withheld.
# Scoped per source because one plan over every source does not fit in a single
# Worker invocation, and repeated in passes because a pass that runs past its
# invocation budget still commits the groups it reached. Runs in the deploy
# environment so the operations key stays in the repository's secret store.
on:
  workflow_dispatch:
    inputs:
      source-ids:
        description: Comma-separated trusted source ids
        required: false
        default: vanshb03-summer-2027,simplify-summer-2026,speedyapply-2027-swe,speedyapply-2027-ai,northwestern-fintech-2027-quant,canadian-tech-2027
      passes:
        description: How many plan/apply passes to run
        required: false
        default: '3'

jobs:
  regrade:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: cloudflare-workers-production
      url: https://intern-notifs.jdkrasnick.workers.dev
    env:
      OPERATIONS_SHARED_SECRET: ${{ secrets.OPERATIONS_SHARED_SECRET }}
      CATALOG_API_URL: ${{ vars.PUBLIC_API_URL }}
      SOURCE_IDS: ${{ inputs.source-ids }}
      PASSES: ${{ inputs.passes }}
    steps:
      - name: Plan and apply each source
        shell: bash
        run: |
          set -uo pipefail
          call() {
            curl -sS -o /tmp/body -w '%{http_code}' -X POST "$CATALOG_API_URL/internal/trusted-admission-backfill" \
              -H "X-Operations-Key: $OPERATIONS_SHARED_SECRET" \
              -H 'Content-Type: application/json' -d "$1" || echo 000
          }
          IFS=',' read -ra ids <<< "$SOURCE_IDS"
          for pass in $(seq 1 "$PASSES"); do
            echo "########## pass $pass"
            for raw in "${ids[@]}"; do
              id=$(echo "$raw" | tr -d ' ')
              status=$(call "{\"apply\":false,\"sourceIds\":[\"$id\"]}")
              dry=$(cat /tmp/body)
              echo "=== $id dry=$status"
              if [ "$status" != "200" ]; then echo "$dry" | head -c 400; continue; fi
              echo "$dry" | jq -c '{totals, changes}'
              expected=$(echo "$dry" | jq -r '.expectedChanged')
              token=$(echo "$dry" | jq -r '.repairToken')
              if [ "$expected" = "0" ]; then echo "    nothing to publish"; continue; fi
              status=$(call "{\"apply\":true,\"repairToken\":\"$token\",\"expectedChanged\":$expected,\"sourceIds\":[\"$id\"]}")
              applied=$(cat /tmp/body)
              echo "=== $id apply=$status"
              echo "$applied" | jq -c '{applied, appliedTotals, projectionRefreshRequired, conflicts}' 2>/dev/null \
                || echo "$applied" | head -c 400
            done
          done
