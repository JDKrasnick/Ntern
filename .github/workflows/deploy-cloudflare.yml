name: Deploy Cloudflare Workers

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Exact green commit currently at the tip of main
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: cloudflare-workers-production
  cancel-in-progress: false

jobs:
  deploy:
    outputs:
      ci_run_id: ${{ steps.revision.outputs.ci_run_id }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: cloudflare-workers-production
      url: https://intern-notifs.jdkrasnick.workers.dev
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
      TF_VAR_deploy_sha: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_STATE_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_STATE_SECRET_ACCESS_KEY }}
      AWS_REGION: auto
      AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      TF_VAR_api_hostname: api.ntern.app
      TF_VAR_zone_id: 404f6f4bd82cabd507e8662facfdc3b5
      TF_VAR_public_api_url: ${{ vars.PUBLIC_API_URL }}
      TF_VAR_employer_portal_enabled: ${{ vars.EMPLOYER_PORTAL_ENABLED }}
      TF_VAR_auth_from_email: ${{ secrets.AUTH_FROM_EMAIL }}
      TF_VAR_gmail_enabled: ${{ vars.GMAIL_ENABLED }}
      TF_VAR_gmail_client_id: ${{ vars.GMAIL_CLIENT_ID }}
      TF_VAR_gmail_redirect_uri: ${{ vars.GMAIL_REDIRECT_URI }}
      TF_VAR_identity_unconfirmed_publication_enabled: ${{ vars.IDENTITY_UNCONFIRMED_PUBLICATION_ENABLED }}
      TF_VAR_trusted_community_catalog_enabled: ${{ vars.TRUSTED_COMMUNITY_CATALOG_ENABLED }}
      TF_VAR_identity_confirmed_coverage_floor: ${{ vars.IDENTITY_CONFIRMED_COVERAGE_FLOOR }}
      TF_VAR_ingestion_v2_isolated_workers_enabled: ${{ vars.INGESTION_V2_ISOLATED_WORKERS_ENABLED || 'false' }}
      TF_VAR_ingestion_v2_shadow_discovery_enabled: ${{ vars.INGESTION_V2_SHADOW_DISCOVERY_ENABLED }}
      TF_VAR_ingestion_v2_shadow_source_allowlist: ${{ vars.INGESTION_V2_SHADOW_SOURCE_ALLOWLIST }}
      TF_VAR_ingestion_v2_admission_enabled: ${{ vars.INGESTION_V2_ADMISSION_ENABLED }}
      TF_VAR_ingestion_v2_admission_source_allowlist: ${{ vars.INGESTION_V2_ADMISSION_SOURCE_ALLOWLIST }}
      TF_VAR_ingestion_v2_catalog_writer_enabled: ${{ vars.INGESTION_V2_CATALOG_WRITER_ENABLED }}
      TF_VAR_ingestion_v2_catalog_writer_source_allowlist: ${{ vars.INGESTION_V2_CATALOG_WRITER_SOURCE_ALLOWLIST }}
      TF_VAR_ingestion_v2_legacy_catalog_write_disabled_source_allowlist: ${{ vars.INGESTION_V2_LEGACY_CATALOG_WRITE_DISABLED_SOURCE_ALLOWLIST }}
      TF_VAR_ingestion_v2_trusted_community_alert_source_allowlist: ${{ vars.INGESTION_V2_TRUSTED_COMMUNITY_ALERT_SOURCE_ALLOWLIST }}
      TF_VAR_llm_metadata_publication_policy_json: ${{ vars.LLM_METADATA_PUBLICATION_POLICY_JSON }}
      TF_VAR_admission_support_recipient: ${{ secrets.ADMISSION_SUPPORT_RECIPIENT }}
      TF_VAR_shadow_extraction_enabled: ${{ vars.SHADOW_EXTRACTION_ENABLED }}
      TF_VAR_shadow_extraction_monthly_forecast_cents: ${{ vars.SHADOW_EXTRACTION_MONTHLY_FORECAST_CENTS }}
      TF_VAR_shadow_extraction_monthly_headroom_cents: ${{ vars.SHADOW_EXTRACTION_MONTHLY_HEADROOM_CENTS }}
      TF_VAR_resume_tuner_enabled: "true"
      TF_VAR_resume_embedding_index_name: intern-notifs-resume-bank-v1
      OPERATIONS_SHARED_SECRET: ${{ secrets.OPERATIONS_SHARED_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.10.0
      - name: Reject missing production configuration
        shell: bash
        run: |
          required=(
            CLOUDFLARE_API_TOKEN AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY
            TF_VAR_cloudflare_account_id TF_VAR_public_api_url TF_VAR_employer_portal_enabled
            TF_VAR_auth_from_email TF_VAR_gmail_enabled TF_VAR_gmail_client_id
            TF_VAR_gmail_redirect_uri TF_VAR_identity_unconfirmed_publication_enabled
            TF_VAR_trusted_community_catalog_enabled TF_VAR_identity_confirmed_coverage_floor
            TF_VAR_ingestion_v2_catalog_writer_enabled
            TF_VAR_ingestion_v2_catalog_writer_source_allowlist
            TF_VAR_ingestion_v2_legacy_catalog_write_disabled_source_allowlist
            TF_VAR_ingestion_v2_trusted_community_alert_source_allowlist
            TF_VAR_llm_metadata_publication_policy_json TF_VAR_shadow_extraction_enabled
            TF_VAR_admission_support_recipient
            TF_VAR_shadow_extraction_monthly_forecast_cents
            TF_VAR_shadow_extraction_monthly_headroom_cents
            TF_VAR_deploy_sha
          )
          for name in "${required[@]}"; do
            if test -z "${!name}"; then
              echo "Missing production setting: $name" >&2
              exit 1
            fi
          done
      - name: Reject an obsolete or unverified main revision
        id: revision
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          test "$DEPLOY_SHA" = "$(git rev-parse HEAD)"
          test "$DEPLOY_SHA" = "$(git ls-remote origin refs/heads/main | cut -f1)"
          ci_run_id='${{ github.event.workflow_run.id }}'
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            ci_run_id=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?event=push&branch=main&head_sha=$DEPLOY_SHA&per_page=10" \
              --jq '.workflow_runs | map(select(.head_sha == env.DEPLOY_SHA and .conclusion == "success")) | first | .id')
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$ci_run_id" \
            --jq '.head_sha == env.DEPLOY_SHA and .head_branch == "main" and .event == "push" and .conclusion == "success" and .head_repository.full_name == env.GITHUB_REPOSITORY' \
            | grep -qx true
          echo "ci_run_id=$ci_run_id" >> "$GITHUB_OUTPUT"
      - run: npm ci
      - name: Ensure the resume embedding index exists
        shell: bash
        run: |
          index=$(npx wrangler vectorize list --json | jq -c --arg name "$TF_VAR_resume_embedding_index_name" '.[] | select(.name == $name)')
          if test -z "$index"; then
            npx wrangler vectorize create "$TF_VAR_resume_embedding_index_name" \
              --preset '@cf/baai/bge-base-en-v1.5' \
              --description 'Private user-namespaced resume bank embeddings'
            index=$(npx wrangler vectorize list --json | jq -c --arg name "$TF_VAR_resume_embedding_index_name" '.[] | select(.name == $name)')
          fi
          jq -e '.config.dimensions == 768
            and .config.metric == "cosine"
            and .config.preset == "@cf/baai/bge-base-en-v1.5"' <<<"$index" >/dev/null
      - run: npm run build:cloudflare
      - name: Initialize production state
        run: tofu -chdir=infra/cloudflare init -reconfigure
      - name: Back up pre-deploy state
        id: backup_before
        shell: bash
        run: |
          release="production-deployments/$DEPLOY_SHA/$GITHUB_RUN_ID"
          echo "RELEASE_PREFIX=$release" >> "$GITHUB_ENV"
          tofu -chdir=infra/cloudflare state pull > "$RUNNER_TEMP/cloudflare-before.tfstate"
          aws s3 cp "$RUNNER_TEMP/cloudflare-before.tfstate" \
            "s3://intern-notifs-opentofu-state/$release/cloudflare-before.tfstate" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" --only-show-errors
      - name: Reconcile Worker migration state
        shell: bash
        run: |
          reconcile_worker() {
            local resource="$1"
            local script_name="$2"
            tofu -chdir=infra/cloudflare state rm "$resource"
            tofu -chdir=infra/cloudflare import \
              "$resource" \
              "$TF_VAR_cloudflare_account_id/$script_name"
          }

          if rg -q 'new_tag\s*=\s*"v1-d1-traffic-controller"' infra/cloudflare/main.tf \
            && rg -Uq 'old_tag\s*=\s*""\s*\n\s*new_tag\s*=\s*"v1-d1-traffic-controller"' infra/cloudflare/main.tf; then
            if ! reconcile_worker cloudflare_workers_script.ingestion intern-notifs-ingestion; then
              tofu -chdir=infra/cloudflare state push -force "$RUNNER_TEMP/cloudflare-before.tfstate"
              exit 1
            fi
          fi

          if rg -Uq 'old_tag\s*=\s*""\s*\n\s*new_tag\s*=\s*"v4-resume-pdf-compiler-v2"' infra/cloudflare/main.tf; then
            if ! reconcile_worker cloudflare_workers_script.application intern-notifs; then
              tofu -chdir=infra/cloudflare state push -force "$RUNNER_TEMP/cloudflare-before.tfstate"
              exit 1
            fi
          fi
      - name: Create and validate saved plan
        id: plan
        shell: bash
        run: |
          tofu -chdir=infra/cloudflare plan -lock-timeout=5m -out="$RUNNER_TEMP/cloudflare.tfplan"
          tofu -chdir=infra/cloudflare show -json "$RUNNER_TEMP/cloudflare.tfplan" > "$RUNNER_TEMP/cloudflare-plan.json"
          npx tsx scripts/cloudflare-plan-guard.ts "$RUNNER_TEMP/cloudflare-plan.json"
          aws s3 cp "$RUNNER_TEMP/cloudflare.tfplan" \
            "s3://intern-notifs-opentofu-state/$RELEASE_PREFIX/cloudflare.tfplan" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" --only-show-errors
          sha256sum "$RUNNER_TEMP/cloudflare.tfplan" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Apply production D1 migrations
        run: npx wrangler d1 migrations apply intern-notifs-db --remote --config wrangler.api.jsonc
      - name: Apply exact saved plan
        if: steps.plan.outputs.changed == 'true'
        run: tofu -chdir=infra/cloudflare apply -auto-approve "$RUNNER_TEMP/cloudflare.tfplan"
      - name: Publish and roll out the resume PDF compiler container
        shell: bash
        run: |
          config="$GITHUB_WORKSPACE/.wrangler.api.production.jsonc"
          trap 'rm -f "$config"' EXIT
          jq 'del(.vars)' wrangler.api.jsonc > "$config"
          npx wrangler deploy --config "$config" --keep-vars \
            --tag "$DEPLOY_SHA" \
            --message "Container rollout for $DEPLOY_SHA"
      - name: Capture expected Worker code identities
        shell: bash
        run: |
          set -euo pipefail
          api_name=intern-notifs
          ingestion_name=intern-notifs-ingestion

          npx wrangler deployments status --name "$api_name" --config wrangler.api.jsonc --json > "$RUNNER_TEMP/api-expected-deployment.json"
          npx wrangler deployments status --name "$ingestion_name" --config wrangler.ingestion.jsonc --json > "$RUNNER_TEMP/ingestion-expected-deployment.json"
          jq -e '.versions | length == 1 and .[0].percentage == 100' "$RUNNER_TEMP/api-expected-deployment.json" >/dev/null
          jq -e '.versions | length == 1 and .[0].percentage == 100' "$RUNNER_TEMP/ingestion-expected-deployment.json" >/dev/null
          api_version="$(jq -er '.versions[0].version_id' "$RUNNER_TEMP/api-expected-deployment.json")"
          ingestion_version="$(jq -er '.versions[0].version_id' "$RUNNER_TEMP/ingestion-expected-deployment.json")"
          npx wrangler versions view "$api_version" --name "$api_name" --config wrangler.api.jsonc --json > "$RUNNER_TEMP/api-expected-version.json"
          npx wrangler versions view "$ingestion_version" --name "$ingestion_name" --config wrangler.ingestion.jsonc --json > "$RUNNER_TEMP/ingestion-expected-version.json"
          jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha' "$RUNNER_TEMP/api-expected-version.json" >/dev/null
          jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha' "$RUNNER_TEMP/ingestion-expected-version.json" >/dev/null
          echo "EXPECTED_API_VERSION=$api_version" >> "$GITHUB_ENV"
          echo "EXPECTED_INGESTION_VERSION=$ingestion_version" >> "$GITHUB_ENV"
          echo "EXPECTED_API_ETAG=$(jq -er '.resources.script.etag' "$RUNNER_TEMP/api-expected-version.json")" >> "$GITHUB_ENV"
          echo "EXPECTED_INGESTION_ETAG=$(jq -er '.resources.script.etag' "$RUNNER_TEMP/ingestion-expected-version.json")" >> "$GITHUB_ENV"
          for role in admission catalog-publisher; do
            name="intern-notifs-$role"
            npx wrangler deployments status --name "$name" --config "wrangler.$role.jsonc" --json > "$RUNNER_TEMP/$role-expected-deployment.json"
            jq -e '.versions | length == 1 and .[0].percentage == 100' "$RUNNER_TEMP/$role-expected-deployment.json" >/dev/null
            version="$(jq -er '.versions[0].version_id' "$RUNNER_TEMP/$role-expected-deployment.json")"
            npx wrangler versions view "$version" --name "$name" --config "wrangler.$role.jsonc" --json > "$RUNNER_TEMP/$role-expected-version.json"
            jq -e --arg sha "$DEPLOY_SHA" '.annotations["workers/tag"] == $sha and .annotations["workers/message"] == ("Release " + $sha)' "$RUNNER_TEMP/$role-expected-version.json" >/dev/null
          done
      - name: Restore operations binding if its deployment check rejects the key
        shell: bash
        run: |
          if test -n "$OPERATIONS_SHARED_SECRET"; then
            restore_secret() {
              local name="$1"
              local config="$2"
              local expected_version="$3"
              local latest_version
              local secret_version

              latest_version="$(npx wrangler versions list --name "$name" --config "$config" --json \
                | jq -er 'max_by(.created_on).id')"
              test "$latest_version" = "$expected_version"
              printf '%s' "$OPERATIONS_SHARED_SECRET" \
                | npx wrangler versions secret put OPERATIONS_SHARED_SECRET \
                    --name "$name" --config "$config" \
                    --tag "$DEPLOY_SHA" --message "Release $DEPLOY_SHA"
              secret_version="$(npx wrangler versions list --name "$name" --config "$config" --json \
                | jq -er --arg sha "$DEPLOY_SHA" \
                    '[.[] | select(.annotations["workers/tag"] == $sha and .annotations["workers/message"] == ("Release " + $sha))] | max_by(.created_on).id')"
              test "$secret_version" != "$expected_version"
              npx wrangler versions deploy "${secret_version}@100%" \
                --name "$name" --config "$config" --yes \
                --message "Restore operations binding for $DEPLOY_SHA"
            }

            status="$(curl -sS -o /dev/null -w '%{http_code}' \
              -H "X-Operations-Key: $OPERATIONS_SHARED_SECRET" \
              "$TF_VAR_public_api_url/internal/deployment")"
            if test "$status" = 404; then
              restore_secret intern-notifs-ingestion wrangler.ingestion.jsonc "$EXPECTED_INGESTION_VERSION"
              restore_secret intern-notifs wrangler.api.jsonc "$EXPECTED_API_VERSION"
            fi
          fi
      - name: Final convergence gate
        shell: bash
        run: |
          set -euo pipefail
          api_name=intern-notifs
          ingestion_name=intern-notifs-ingestion

          # Confirm the active deployments and read both active versions.
          npx wrangler deployments status --name "$api_name" --config wrangler.api.jsonc --json > "$RUNNER_TEMP/api-deployment.json"
          npx wrangler deployments status --name "$ingestion_name" --config wrangler.ingestion.jsonc --json > "$RUNNER_TEMP/ingestion-deployment.json"
          api_version="$(jq -r '.versions[0].version_id' "$RUNNER_TEMP/api-deployment.json")"
          ingestion_version="$(jq -r '.versions[0].version_id' "$RUNNER_TEMP/ingestion-deployment.json")"
          npx wrangler versions view "$api_version" --name "$api_name" --config wrangler.api.jsonc --json > "$RUNNER_TEMP/api-version.json"
          npx wrangler versions view "$ingestion_version" --name "$ingestion_name" --config wrangler.ingestion.jsonc --json > "$RUNNER_TEMP/ingestion-version.json"

          for role in admission catalog-publisher; do
            name="intern-notifs-$role"
            npx wrangler deployments status --name "$name" --config "wrangler.$role.jsonc" --json > "$RUNNER_TEMP/$role-deployment.json"
            version="$(jq -er '.versions[0].version_id' "$RUNNER_TEMP/$role-deployment.json")"
            npx wrangler versions view "$version" --name "$name" --config "wrangler.$role.jsonc" --json > "$RUNNER_TEMP/$role-version.json"
            jq -n --arg name "$name" --arg role "$role" \
              --slurpfile expected "$RUNNER_TEMP/$role-expected-version.json" \
              --slurpfile deployment "$RUNNER_TEMP/$role-deployment.json" \
              --slurpfile version "$RUNNER_TEMP/$role-version.json" \
              '{scriptName:$name,address:("cloudflare_workers_script.isolated[\""+$role+"\"]"),expectedEtag:$expected[0].resources.script.etag,deployment:$deployment[0],version:$version[0]}' > "$RUNNER_TEMP/$role-audit.json"
          done
          jq -s '.' "$RUNNER_TEMP/admission-audit.json" "$RUNNER_TEMP/catalog-publisher-audit.json" > "$RUNNER_TEMP/isolated-audit.json"

          # Capture the post-apply plan and require that production has converged.
          set +e
          tofu -chdir=infra/cloudflare plan -lock-timeout=5m -detailed-exitcode -out="$RUNNER_TEMP/cloudflare-final.tfplan"
          drift=$?
          set -e
          tofu -chdir=infra/cloudflare show -json "$RUNNER_TEMP/cloudflare-final.tfplan" > "$RUNNER_TEMP/cloudflare-final-plan.json"

          # Compare every non-secret binding, compatibility setting, handler, and
          # limit; extra secret_text bindings are permitted.
          npx tsx scripts/cloudflare-live-audit.ts \
            --plan "$RUNNER_TEMP/cloudflare-final-plan.json" \
            --api-name "$api_name" \
            --api-expected-etag "$EXPECTED_API_ETAG" \
            --api-deployment "$RUNNER_TEMP/api-deployment.json" \
            --api-version "$RUNNER_TEMP/api-version.json" \
            --ingestion-name "$ingestion_name" \
            --ingestion-expected-etag "$EXPECTED_INGESTION_ETAG" \
            --ingestion-deployment "$RUNNER_TEMP/ingestion-deployment.json" \
            --ingestion-version "$RUNNER_TEMP/ingestion-version.json" \
            --isolated-workers "$RUNNER_TEMP/isolated-audit.json" \
            --drift-exit-code "$drift"

          # Any drift fails the deployment before smoke tests or success reporting.
          test "$drift" = 0
      - name: Back up post-deploy state
        if: always() && steps.backup_before.outcome == 'success'
        shell: bash
        run: |
          tofu -chdir=infra/cloudflare state pull > "$RUNNER_TEMP/cloudflare-after.tfstate"
          aws s3 cp "$RUNNER_TEMP/cloudflare-after.tfstate" \
            "s3://intern-notifs-opentofu-state/$RELEASE_PREFIX/cloudflare-after.tfstate" \
            --endpoint-url "$AWS_ENDPOINT_URL_S3" --only-show-errors
      - name: Smoke-test and monitor production
        shell: bash
        run: |
          api="$TF_VAR_public_api_url"
          for attempt in 1 2 3; do
            test "$(curl -fsS -o /dev/null -w '%{http_code}' "$api/jobs")" = 200
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$api/me/applications")" = 401
            test "$(curl -sS -o /dev/null -w '%{http_code}' "$api/operations/sources")" = 401
            if test "$attempt" != 3; then sleep 60; fi
          done
          curl -fsS "$api/catalog?disciplines=Software%20Engineering" \
            | jq -e '.groups | length > 0 and all(.[]; .disciplines | index("SWE"))' >/dev/null
          if test -n "$OPERATIONS_SHARED_SECRET"; then
            curl -fsS -H "X-Operations-Key: $OPERATIONS_SHARED_SECRET" "$api/internal/deployment" \
              | jq -e '.api and .ingestion' >/dev/null
          fi
  deploy-web:
    needs: deploy
    runs-on: ubuntu-latest
    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: false
    environment:
      name: cloudflare-pages-production
      url: https://ntern.app
    env:
      DEPLOY_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || inputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: web-dist-${{ env.DEPLOY_SHA }}
          path: mobile/dist
          run-id: ${{ needs.deploy.outputs.ci_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the artifact's API supports bounded public reads
        run: npx tsx scripts/verify-public-web-api.ts mobile/dist/public-api.json
      - name: Reject an obsolete main revision
        run: test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$DEPLOY_SHA"
      - name: Deploy verified web artifact
        run: npx wrangler pages deploy mobile/dist --project-name internnotifs --branch main --commit-hash "$DEPLOY_SHA" --commit-dirty=false
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
